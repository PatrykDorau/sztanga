# Netlify: build Vite i routing SPA (Vue Router w trybie history).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Publiczne dane projektu Supabase (i tak trafiają do kodu w przeglądarce; dostęp chroni RLS).
  VITE_SUPABASE_URL = "https://kbqbmdzjuusbmyhrdqke.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NWwLtgEffEVBLzGz7mE54A_xmeWbgH6"

# Każdy adres (np. /grafik, /p/<token>) obsługuje index.html – routing robi aplikacja.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker PWA zawsze świeży, żeby aktualizacje docierały od razu.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
